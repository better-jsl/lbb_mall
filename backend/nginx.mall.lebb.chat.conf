server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    location = / {
        return 302 /h5/;
    }

    location = /h5 {
        return 301 /h5/;
    }

    location /h5/ {
        alias /var/www/lbb-mall/h5/;
        try_files $uri $uri/ /h5/index.html;
    }

    location /styles/ {
        alias /var/www/lbb-mall/h5/styles/;
    }

    location /assets/ {
        alias /var/www/lbb-mall/h5/assets/;
    }

    location /games/ {
        alias /var/www/lbb-mall/h5/games/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /var/www/lbb-mall/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location ~ ^/(merchants|points-mall|users|orders|dashboard|settings|games)$ {
        try_files "" /admin/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mall.lebb.chat;

    ssl_certificate /etc/letsencrypt/live/mall.lebb.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mall.lebb.chat/privkey.pem;
    client_max_body_size 20m;

    location = / {
        return 302 /h5/;
    }

    location = /h5 {
        return 301 /h5/;
    }

    location /h5/ {
        alias /var/www/lbb-mall/h5/;
