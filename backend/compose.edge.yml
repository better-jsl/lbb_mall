services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.mall.lebb.chat.cloud.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - ./www:/var/www/lbb-mall:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  letsencrypt:
    external: true
    name: backend_letsencrypt
  certbot_webroot:
    external: true
    name: backend_certbot_webroot
